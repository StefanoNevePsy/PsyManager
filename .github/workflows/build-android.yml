name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compute commit-count versionCode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install rsvg-convert (for icon PNG generation)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ----------------------------------------------------------------------
      # Compute version metadata.
      # versionCode: commit count — strictly monotonically increasing.
      # versionName: package.json version + build number (informative).
      # ----------------------------------------------------------------------
      - name: Compute version metadata
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_NAME="${PKG_VERSION}.${COMMIT_COUNT}"
          echo "package_version=$PKG_VERSION"   >> "$GITHUB_OUTPUT"
          echo "version_code=$COMMIT_COUNT"     >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME"     >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION_NAME-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(git rev-parse --short HEAD)
          REF_NAME="${GITHUB_REF_NAME}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "ref_name=$REF_NAME"   >> "$GITHUB_OUTPUT"
          echo ""
          echo "=========================================="
          echo " Branch:      $REF_NAME"
          echo " Commit:      $SHORT_SHA"
          echo " versionCode: $COMMIT_COUNT"
          echo " versionName: $VERSION_NAME"
          echo "=========================================="
          {
            echo "### Build"
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$REF_NAME\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| versionName | \`$VERSION_NAME\` |"
            echo "| versionCode | \`$COMMIT_COUNT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
        # cap:build emits root-relative URLs (base "/") and skips the PWA
        # service worker, both required for the Capacitor WebView. The
        # default `npm run build` is for GitHub Pages and bakes in
        # `/PsyManager/` paths that 404 inside the native app.
        run: npm run cap:build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Customize Android (icons, back gestures, version)
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./scripts/setup-android.sh

      # ----------------------------------------------------------------------
      # Decode release keystore from secrets if available; otherwise
      # the build will produce a debug-signed APK that is still installable
      # for testing/sideloading. For production releases (Play Store or
      # OTA updates that preserve data), configure the keystore secrets:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # ----------------------------------------------------------------------
      - name: Check keystore availability
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. Building a debug-signed APK."
            echo "::warning::Updates installed from a debug APK and a release APK are NOT compatible — you will lose data when switching."
          fi

      - name: Decode release keystore
        id: keystore
        if: ${{ steps.keystore_check.outputs.available == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      # Append a standalone `android { }` block instead of regex-patching the
      # existing one: Gradle merges repeated extension blocks, so this works
      # regardless of how the Capacitor template formats build.gradle.
      - name: Configure signing in build.gradle
        if: ${{ steps.keystore_check.outputs.available == 'true' }}
        run: |
          cat >> android/app/build.gradle <<'GRADLEEOF'

          // --- Release signing (appended by CI) ---
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLEEOF
          echo "--- tail of build.gradle ---"
          tail -n 20 android/app/build.gradle

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH:     ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.keystore_check.outputs.available }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug   --no-daemon --stacktrace
          fi

      - name: Locate built APK
        id: apk
        run: |
          if [ "${{ steps.keystore_check.outputs.available }}" = "true" ]; then
            DIR=android/app/build/outputs/apk/release
            SUFFIX=""
          else
            DIR=android/app/build/outputs/apk/debug
            SUFFIX="-debug"
          fi

          echo "APKs produced in $DIR:"
          ls -1 "$DIR" || true

          # An unsigned APK installs nowhere ("package appears invalid"), so
          # never publish one: pick a signed APK explicitly.
          APK_PATH=$(find "$DIR" -name "*.apk" ! -name "*unsigned*" | sort | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No signed APK produced in $DIR. Check the signing configuration and the keystore secrets."
            find "$DIR" -name "*.apk" -print >&2 || true
            exit 1
          fi

          DEST="psymanager-${{ steps.version.outputs.version_name }}${SUFFIX}.apk"
          cp "$APK_PATH" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Selected: $APK_PATH -> $DEST"
          ls -lh "$DEST"

      # Hard gate: a package that fails signature verification must never be
      # published — it is exactly what produces "pacchetto non valido".
      - name: Verify APK signature
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the Android SDK"
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "✓ APK signature verified"

      # Facts about the produced package: which signature schemes are present
      # (Android 11+ REQUIRES v2+ when targetSdk >= 30) and whether the
      # manifest parses at all, which is what "invalid package" really means.
      - name: Inspect APK (signature schemes, sdk levels, icon)
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "=== apksigner: signature schemes ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sig.txt

          echo ""
          echo "=== Verified schemes ==="
          for scheme in "v1 scheme (JAR signing)" "v2 scheme (APK Signature Scheme v2)" "v3 scheme (APK Signature Scheme v3)"; do
            grep -i "Verified using $scheme" /tmp/sig.txt || true
          done

          # Android 11+ refuses to install a v1-only package when targetSdk>=30
          if grep -qi "Verified using v1 scheme.*true" /tmp/sig.txt \
             && ! grep -qi "Verified using v2 scheme.*true" /tmp/sig.txt; then
            echo "::error::APK is signed with the v1 scheme only. Android 11+ rejects this as an invalid package."
            exit 1
          fi

          echo ""
          echo "=== aapt2 badging (manifest must parse) ==="
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application:|^application-icon|^launchable-activity:|native-code" /tmp/badging.txt || true

          echo ""
          echo "=== zip integrity ==="
          unzip -t "$APK" > /dev/null && echo "✓ archive is intact"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "size:   $(stat -c%s "$APK") bytes"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: psymanager-android-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ----------------------------------------------------------------------
      # Publish a GitHub Release with the APK attached.
      # Skip on manual runs where release=false.
      # ----------------------------------------------------------------------
      - name: Generate release notes
        if: ${{ github.event_name == 'push' || inputs.release == 'true' }}
        id: notes
        run: |
          {
            echo 'notes<<RELEASEEOF'
            echo "## PsyManager Android · ${{ steps.version.outputs.version_name }}"
            echo ""
            echo "**Branch:** \`${{ steps.version.outputs.ref_name }}\`"
            echo "**versionCode:** \`${{ steps.version.outputs.version_code }}\`"
            echo "**versionName:** \`${{ steps.version.outputs.version_name }}\`"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Recent changes"
            git log --pretty=format:'- %s (%h)' -n 10
            echo ""
            echo ""
            echo "### Installation"
            echo "1. Download \`psymanager-${{ steps.version.outputs.version_name }}.apk\` below"
            echo "2. On your Android device, allow installation from unknown sources"
            echo "3. Open the APK to install or update — your local data is preserved across updates"
            echo 'RELEASEEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        if: ${{ github.event_name == 'push' || inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PsyManager Android ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.ref_name }} · ${{ steps.version.outputs.short_sha }})
          body: ${{ steps.notes.outputs.notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Print exactly where the APK just built can be downloaded, so there is
      # no way to end up installing an older release by mistake.
      - name: Report download link
        if: ${{ github.event_name == 'push' || inputs.release == 'true' }}
        run: |
          URL="${{ steps.release.outputs.url }}"
          {
            echo "### APK pronto"
            echo ""
            echo "- **File:** \`${{ steps.apk.outputs.path }}\`"
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Release:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $URL"
